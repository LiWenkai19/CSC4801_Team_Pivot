name: CI

# Every graded commit on main is checked, and pull requests get the same
# checks before merge. The submission-format check requires "required CI
# checks pass" on the graded commit, so keep these jobs green.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly full advanced run (Monday 04:17 UTC). The fast modes still run on
    # every push/PR; the SLOW mutation/apifuzz/coverage modes run here.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # Cheap gate: catches syntax errors and undefined names in one minute.
  # Only E9/F63/F7/F82 are selected, not full style linting.
  lint:
    name: Lint (syntax and undefined names)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: python -m pip install "ruff==0.15.18"

      - name: Check syntax errors and undefined names
        run: >-
          ruff check
          backend/app
          backend/scripts
          backend/tests
          tests/unit
          tests/run_tests.py
          --select E9,F63,F7,F82
          --output-format=github

  # FP-TEST-1: the single documented unit command must run non-interactively
  # and exit nonzero on failure. Needs Node because the rendering unit test
  # loads the real React component.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund

      - name: Run unit suite
        run: python tests/run_tests.py --junitxml=unit-results.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-results
          path: unit-results.xml
          if-no-files-found: ignore

  # Real PostgreSQL tests: both conftests create their own throwaway database
  # on this disposable service container, so no state leaks between runs.
  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CANDIDATE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
      EMPLOYER_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run integration suite on disposable PostgreSQL
        run: >-
          python tests/run_tests.py --integration
          --junitxml="$GITHUB_WORKSPACE/integration-results.xml"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: integration-results.xml
          if-no-files-found: ignore

  # FP-SUB-1 / FP-ARCH-1: the graded commit must build, start, seed and test
  # entirely from its own Dockerfile, with no undocumented image or secret.
  docker:
    name: Docker build, start, seed and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image from Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: csc4801-final:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run -d --name csc4801 -p 127.0.0.1:8080:80 csc4801-final:ci

      - name: Wait for healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' csc4801 2>/dev/null || echo missing)
            echo "attempt $i: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              break
            fi
            sleep 5
          done
          docker logs csc4801
          exit 1

      - name: Seed demo data
        run: docker exec -w /app/backend csc4801 python scripts/seed_demo.py

      - name: Run documented unit suite inside the image
        run: docker exec -w /app csc4801 python tests/run_tests.py

      - name: Smoke test through nginx
        run: |
          set -e
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/users/me)
          echo "unauthenticated GET /api/users/me -> $code"
          test "$code" = "401"

          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"email":"demo-alice@example.com","password":"demo-local-only"}' \
            http://127.0.0.1:8080/api/users/login)
          echo "demo login POST /api/users/login -> $code"
          test "$code" = "200"

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)
          echo "frontend index GET / -> $code"
          test "$code" = "200"

      - name: Container logs on failure
        if: failure()
        run: docker logs csc4801

  # Advanced techniques live outside the image and outside the mandatory unit
  # command.  They get their own disposable PostgreSQL service and their own
  # pinned dependency file.  Once the techniques were stable, P11 made this a
  # required job and added the unit branch-coverage gate here (not in the unit
  # job, because coverage is only installed from tests/advanced/requirements.txt).
  advanced:
    name: Advanced tests (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ADVANCED_PG_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            tests/advanced/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: >-
          python -m pip install
          -r requirements.txt
          -r tests/advanced/requirements.txt

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund

      # Gate: the measured unit-suite branch coverage (94.44% locally) rounded
      # down to a multiple of five.  pytest-cov is available here but is not in
      # requirements.lock, so this command must not move into the unit job or
      # the Docker image.
      - name: Unit branch-coverage gate
        env:
          APP_NAME: Business unit tests
          DATABASE_URL: postgresql+psycopg://unit:unit@127.0.0.1:1/unit_not_a_database
          COOKIE_SECURE: "false"
          PYTHONPATH: backend
          PYTHONUTF8: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "4801"
          COVERAGE_FILE: ${{ runner.temp }}/unit-coverage
        run: >-
          python -m pytest tests/unit --rootdir=.
          -q -p no:cacheprovider
          --cov=backend/app --cov-branch
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Run fast advanced modes
        run: python tests/advanced/run.py fast --out "$RUNNER_TEMP/advanced"

      - name: Upload advanced artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advanced-results
          path: ${{ runner.temp }}/advanced
          if-no-files-found: ignore

  # Full run: mutation, apifuzz and coverage are SLOW, so they are not part of
  # `fast`.  This job runs weekly and on manual dispatch, on the same
  # PostgreSQL 15 service as the pull-request job, and keeps the complete
  # artefact tree (including coverage.xml/coverage-summary.json).
  advanced-slow:
    name: Advanced tests (all, scheduled/manual)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ADVANCED_PG_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            tests/advanced/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: >-
          python -m pip install
          -r requirements.txt
          -r tests/advanced/requirements.txt

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund

      - name: Run all advanced modes
        run: python tests/advanced/run.py all --out "$RUNNER_TEMP/advanced-slow"

      - name: Upload full advanced artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advanced-slow-results
          path: ${{ runner.temp }}/advanced-slow
          if-no-files-found: ignore
