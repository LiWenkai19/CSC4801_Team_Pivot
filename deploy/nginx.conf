worker_processes 1;
user www-data;
pid /run/nginx.pid;
error_log /var/log/csc4801/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 16m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    access_log /var/log/csc4801/nginx-access.log;

    server {
        listen 80;
        server_name _;

        root /app/frontend/dist;
        index index.html;

        # Same-origin API: strip /api and forward to uvicorn on loopback.
        location /api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Vite emits hashed asset names; cache them aggressively.
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-store";
        }

        # SPA fallback: deep links such as /employer/jobs must reach index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
